[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bayes_airr"
version = "1.0.0"
description = "Bayesian deep generative model of BCR N-region nucleotide insertion"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
include = ["bayes_airr*"]
